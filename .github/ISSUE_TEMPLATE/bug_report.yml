name: 🐛 Bug Report
description: Report something that isn't working correctly in 7/24 IDE
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill in the details below so we can reproduce and fix it.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug and what you expected instead.
      placeholder: When I do X, the app does Y, but I expected Z.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can we reproduce the issue?
      placeholder: |
        1. Open the app
        2. Go to '...'
        3. Click '...'
        4. See the error
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      description: See Settings → About (e.g. v1.5.1)
      placeholder: v1.5.1
    validations:
      required: true
  - type: dropdown
    id: provider
    attributes:
      label: Model provider
      options:
        - OpenRouter
        - Ollama (offline)
        - Not relevant
    validations:
      required: false
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Windows 11 23H2
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      description: Paste any console output (DevTools), terminal output, or screenshots. Please remove your API key and any secrets.
      render: shell
    validations:
      required: false
